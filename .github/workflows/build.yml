name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build project
        run: |
          mkdir -p app/src/main/java/com/voicetranslator
          mkdir -p app/src/main/res/values
          echo "android.useAndroidX=true" > gradle.properties
          cat > settings.gradle << 'SETTINGS'
          rootProject.name = "VoiceTranslator"
          include ':app'
          SETTINGS
          cat > build.gradle << 'ROOTGRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:7.4.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
            }
          }
          ROOTGRADLE
          cat > app/build.gradle << 'APPGRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.voicetranslator'
            compileSdkVersion 33
            defaultConfig {
              applicationId "com.voicetranslator"
              minSdkVersion 26
              targetSdkVersion 33
              versionCode 8
              versionName "8.0"
            }
          }
          repositories {
            google()
            mavenCentral()
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          APPGRADLE
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <application android:label="VoiceTranslator" android:theme="@style/Theme.AppCompat">
              <activity
                android:name=".ShareActivity"
                android:exported="true"
                android:theme="@android:style/Theme.NoDisplay">
                <intent-filter>
                  <action android:name="android.intent.action.SEND"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <data android:mimeType="text/plain"/>
                </intent-filter>
              </activity>
              <service
                android:name=".TranslatorService"
                android:exported="false"
                android:foregroundServiceType="mediaPlayback"/>
            </application>
          </manifest>
          MANIFEST
          cat > app/src/main/res/values/strings.xml << 'STRINGS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">VoiceTranslator</string>
          </resources>
          STRINGS
          cat > app/src/main/java/com/voicetranslator/ShareActivity.kt << 'SHARE'
          package com.voicetranslator
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          class ShareActivity : Activity() {
            override fun onCreate(s: Bundle?) {
              super.onCreate(s)
              val raw = intent?.getStringExtra(Intent.EXTRA_TEXT) ?: ""
              val text = cleanInput(raw)
              if (text.isNotEmpty()) {
                val serviceIntent = Intent(this, TranslatorService::class.java)
                serviceIntent.putExtra("text", text)
                startService(serviceIntent)
              }
              finish()
            }
            private fun cleanInput(text: String): String {
              return text
                .replace(Regex("https?://\\S+"), "")
                .replace(Regex("[a-zA-Z0-9.-]+\\.(com|org|net|io|ru|lv)\\S*"), "")
                .replace(Regex("%[0-9A-Fa-f]{2}"), "")
                .replace(Regex("\\s{2,}"), " ")
                .trim()
            }
          }
          SHARE
          cat > app/src/main/java/com/voicetranslator/TranslatorService.kt << 'SERVICE'
          package com.voicetranslator
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.IBinder
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import androidx.core.app.NotificationCompat
          import okhttp3.*
          import org.json.JSONObject
          import java.io.IOException
          import java.util.*
          class TranslatorService : Service(), TextToSpeech.OnInitListener {
            private lateinit var tts: TextToSpeech
            private var textToTranslate = ""
            companion object {
              const val ACTION_STOP = "com.voicetranslator.STOP"
              const val CHANNEL_ID = "translator_channel"
              const val NOTIF_ID = 1
            }
            override fun onBind(intent: Intent?): IBinder? = null
            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
              if (intent?.action == ACTION_STOP) {
                if (::tts.isInitialized) tts.stop()
                stopSelf()
                return START_NOT_STICKY
              }
              textToTranslate = intent?.getStringExtra("text") ?: ""
              createNotificationChannel()
              val notification = buildNotification()
              startForeground(NOTIF_ID, notification)
              tts = TextToSpeech(this, this)
              return START_NOT_STICKY
            }
            private fun createNotificationChannel() {
              val channel = NotificationChannel(
                CHANNEL_ID, "Переводчик", NotificationManager.IMPORTANCE_LOW
              )
              getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
            }
            private fun buildNotification() = run {
              val stopIntent = PendingIntent.getService(
                this, 0,
                Intent(this, TranslatorService::class.java).apply { action = ACTION_STOP },
                PendingIntent.FLAG_IMMUTABLE
              )
              NotificationCompat.Builder(this, CHANNEL_ID)
                .setContentTitle("VoiceTranslator")
                .setContentText("Идёт перевод...")
                .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                .addAction(android.R.drawable.ic_media_pause, "Стоп", stopIntent)
                .setOngoing(true)
                .build()
            }
            override fun onInit(status: Int) {
              if (status == TextToSpeech.SUCCESS && textToTranslate.isNotEmpty()) {
                tts.language = Locale("ru")
                translate(textToTranslate)
              } else {
                stopSelf()
              }
            }
            private fun cleanTranslation(raw: String): String {
              return raw
                .replace(Regex("\\s*\\d+%.*$", RegexOption.IGNORE_CASE), "")
                .substringBefore("[")
                .substringBefore("MYMEMORY")
                .substringBefore("PLEASE")
                .substringBefore("YOU USED")
                .trim()
            }
            private fun translate(text: String) {
              val encoded = java.net.URLEncoder.encode(text, "UTF-8")
              val url = "https://api.mymemory.translated.net/get?q=$encoded&langpair=en|ru"
              OkHttpClient().newCall(Request.Builder().url(url).build()).enqueue(object : Callback {
                override fun onFailure(call: Call, e: IOException) { stopSelf() }
                override fun onResponse(call: Call, response: Response) {
                  val body = response.body?.string() ?: run { stopSelf(); return }
                  val translated = try {
                    val raw = JSONObject(body)
                      .getJSONObject("responseData")
                      .getString("translatedText")
                    cleanTranslation(raw)
                  } catch (e: Exception) {
                    stopSelf()
                    return
                  }
                  if (translated.isEmpty()) { stopSelf(); return }
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                    override fun onStart(u: String?) {}
                    override fun onDone(u: String?) { tts.stop(); stopSelf() }
                    override fun onError(u: String?) { tts.stop(); stopSelf() }
                  })
                  tts.speak(translated, TextToSpeech.QUEUE_FLUSH, null, "done")
                }
              })
            }
            override fun onDestroy() {
              if (::tts.isInitialized) tts.shutdown()
              super.onDestroy()
            }
          }
          SERVICE
          curl -L https://services.gradle.org/distributions/gradle-7.6-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-7.6/bin/gradle wrapper
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslator
          path: app/build/outputs/apk/debug/app-debug.apk
