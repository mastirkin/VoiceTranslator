name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/voicetranslator
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = "VoiceTranslator"
          include ':app'
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.voicetranslator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.voicetranslator"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE"/>
              <application
                  android:allowBackup="true"
                  android:label="VoiceTranslator"
                  android:theme="@style/Theme.AppCompat">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".TranslatorAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Create accessibility config
        run: |
          cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewTextSelectionChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_description"/>
          EOF

      - name: Create strings
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">VoiceTranslator</string>
              <string name="accessibility_description">Переводит выделенный текст голосом</string>
          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/voicetranslator/MainActivity.kt << 'EOF'
          package com.voicetranslator
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  finish()
              }
          }
          EOF

      - name: Create AccessibilityService
        run: |
          cat > app/src/main/java/com/voicetranslator/TranslatorAccessibilityService.kt << 'EOF'
          package com.voicetranslator
          import android.accessibilityservice.AccessibilityService
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import okhttp3.*
          import org.json.JSONObject
          import java.io.IOException
          import java.util.*
          class TranslatorAccessibilityService : AccessibilityService(), TextToSpeech.OnInitListener {
              private lateinit var tts: TextToSpeech
              private val client = OkHttpClient()
              private var lastText = ""
              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this, this)
              }
              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts.language = Locale("ru")
                  }
              }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_VIEW_TEXT_SELECTION_CHANGED) {
                      val node = event.source ?: return
                      val text = node.text?.toString() ?: return
                      val start = node.textSelectionStart
                      val end = node.textSelectionEnd
                      if (start >= 0 && end > start && end <= text.length) {
                          val selected = text.substring(start, end).trim()
                          if (selected.length > 2 && selected != lastText) {
                              lastText = selected
                              translateAndSpeak(selected)
                          }
                      }
                  }
              }
              private fun translateAndSpeak(text: String) {
                  val url = "https://api.mymemory.translated.net/get?q=${java.net.URLEncoder.encode(text, "UTF-8")}&langpair=en|ru"
                  val request = Request.Builder().url(url).build()
                  client.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {}
                      override fun onResponse(call: Call, response: Response) {
                          val body = response.body?.string() ?: return
                          val translated = JSONObject(body)
                              .getJSONObject("responseData")
                              .getString("translatedText")
                          tts.speak(translated, TextToSpeech.QUEUE_FLUSH, null, null)
                      }
                  })
              }
              override fun onInterrupt() {}
              override fun onDestroy() {
                  tts.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Make gradlew
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          cat gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslator
          path: app/build/outputs/apk/debug/app-debug.apk
