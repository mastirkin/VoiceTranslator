name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build project
        run: |
          mkdir -p app/src/main/java/com/voicetranslator
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          echo "android.useAndroidX=true" > gradle.properties
          cat > settings.gradle << 'SETTINGS'
          rootProject.name = "VoiceTranslator"
          include ':app'
          SETTINGS
          cat > build.gradle << 'ROOTGRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:7.4.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
            }
          }
          ROOTGRADLE
          cat > app/build.gradle << 'APPGRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.voicetranslator'
            compileSdkVersion 33
            defaultConfig {
              applicationId "com.voicetranslator"
              minSdkVersion 26
              targetSdkVersion 33
              versionCode 2
              versionName "2.0"
            }
          }
          repositories {
            google()
            mavenCentral()
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          APPGRADLE
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="VoiceTranslator" android:theme="@style/Theme.AppCompat">
              <activity android:name=".ShareActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.SEND"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <data android:mimeType="text/plain"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          cat > app/src/main/res/values/strings.xml << 'STRINGS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">VoiceTranslator</string>
          </resources>
          STRINGS
          cat > app/src/main/java/com/voicetranslator/ShareActivity.kt << 'SHARE'
          package com.voicetranslator
          import android.app.Activity
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import okhttp3.*
          import org.json.JSONObject
          import java.io.IOException
          import java.util.*
          class ShareActivity : Activity(), TextToSpeech.OnInitListener {
            private lateinit var tts: TextToSpeech
            private var textToTranslate = ""
            override fun onCreate(s: Bundle?) {
              super.onCreate(s)
              tts = TextToSpeech(this, this)
              textToTranslate = intent?.getStringExtra(android.content.Intent.EXTRA_TEXT) ?: ""
            }
            override fun onInit(status: Int) {
              if (status == TextToSpeech.SUCCESS) {
                tts.language = Locale("ru")
                if (textToTranslate.isNotEmpty()) translate(textToTranslate)
              }
            }
            private fun translate(text: String) {
              val url = "https://api.mymemory.translated.net/get?q=${java.net.URLEncoder.encode(text,"UTF-8")}&langpair=en|ru"
              OkHttpClient().newCall(Request.Builder().url(url).build()).enqueue(object : Callback {
                override fun onFailure(call: Call, e: IOException) { finish() }
                override fun onResponse(call: Call, response: Response) {
                  val translated = JSONObject(response.body?.string() ?: return)
                    .getJSONObject("responseData").getString("translatedText")
                  tts.setOnUtteranceProgressListener(object : android.speech.tts.UtteranceProgressListener() { override fun onStart(u: String?) {} override fun onDone(u: String?) { runOnUiThread { finish() } } override fun onError(u: String?) { runOnUiThread { finish() } } })
                  tts.speak(translated, TextToSpeech.QUEUE_FLUSH, null, "done")
                }
              })
            }
            override fun onDestroy() { tts.shutdown(); super.onDestroy() }
          }
          SHARE
          curl -L https://services.gradle.org/distributions/gradle-7.6-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-7.6/bin/gradle wrapper
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslator
          path: app/build/outputs/apk/debug/app-debug.apk
