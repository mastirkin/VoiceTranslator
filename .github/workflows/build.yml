name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build project
        run: |
          mkdir -p app/src/main/java/com/voicetranslator
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          echo "android.useAndroidX=true" > gradle.properties
          cat > settings.gradle << 'SETTINGS'
          rootProject.name = "VoiceTranslator"
          include ':app'
          SETTINGS
          cat > build.gradle << 'ROOTGRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:7.4.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
            }
          }
          ROOTGRADLE
          cat > app/build.gradle << 'APPGRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.voicetranslator'
            compileSdkVersion 33
            defaultConfig {
              applicationId "com.voicetranslator"
              minSdkVersion 26
              targetSdkVersion 33
              versionCode 1
              versionName "1.0"
            }
          }
          repositories {
            google()
            mavenCentral()
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          APPGRADLE
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE"/>
            <application android:label="VoiceTranslator" android:theme="@style/Theme.AppCompat">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".TranslatorService" android:exported="true"
                android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                <intent-filter>
                  <action android:name="android.accessibilityservice.AccessibilityService"/>
                </intent-filter>
                <meta-data android:name="android.accessibilityservice"
                  android:resource="@xml/accessibility_config"/>
              </service>
            </application>
          </manifest>
          MANIFEST
          cat > app/src/main/res/xml/accessibility_config.xml << 'XMLCONFIG'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeViewTextSelectionChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:canRetrieveWindowContent="true"
            android:description="@string/service_desc"/>
          XMLCONFIG
          cat > app/src/main/res/values/strings.xml << 'STRINGS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">VoiceTranslator</string>
            <string name="service_desc">Voice translation service</string>
          </resources>
          STRINGS
          cat > app/src/main/java/com/voicetranslator/MainActivity.kt << 'MAIN'
          package com.voicetranslator
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(s: Bundle?) {
              super.onCreate(s)
              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
              finish()
            }
          }
          MAIN
          cat > app/src/main/java/com/voicetranslator/TranslatorService.kt << 'SERVICE'
          package com.voicetranslator
          import android.accessibilityservice.AccessibilityService
          import android.content.ClipboardManager
          import android.content.Context
          import android.speech.tts.TextToSpeech
          import android.view.accessibility.AccessibilityEvent
          import okhttp3.*
          import org.json.JSONObject
          import java.io.IOException
          import java.util.*
          class TranslatorService : AccessibilityService(), TextToSpeech.OnInitListener {
            private lateinit var tts: TextToSpeech
            private val client = OkHttpClient()
            private var lastText = ""
            override fun onCreate() {
              super.onCreate()
              tts = TextToSpeech(this, this)
              val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cb.addPrimaryClipChangedListener {
                val t = cb.primaryClip?.getItemAt(0)?.text?.toString() ?: return@addPrimaryClipChangedListener
                if (t.length > 2 && t != lastText) { lastText = t; translate(t) }
              }
            }
            override fun onInit(status: Int) { if (status == TextToSpeech.SUCCESS) tts.language = Locale("ru") }
            override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
            override fun onInterrupt() {}
            override fun onDestroy() { tts.shutdown(); super.onDestroy() }
            private fun translate(text: String) {
              val url = "https://api.mymemory.translated.net/get?q=${java.net.URLEncoder.encode(text,"UTF-8")}&langpair=en|ru"
              client.newCall(Request.Builder().url(url).build()).enqueue(object : Callback {
                override fun onFailure(call: Call, e: IOException) {}
                override fun onResponse(call: Call, response: Response) {
                  val translated = JSONObject(response.body?.string() ?: return)
                    .getJSONObject("responseData").getString("translatedText")
                  tts.speak(translated, TextToSpeech.QUEUE_FLUSH, null, null)
                }
              })
            }
          }
          SERVICE
          curl -L https://services.gradle.org/distributions/gradle-7.6-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-7.6/bin/gradle wrapper
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslator
          path: app/build/outputs/apk/debug/app-debug.apk
