name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build project
        run: |
          mkdir -p app/src/main/java/com/voicetranslator
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-ldpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          echo "android.useAndroidX=true" > gradle.properties
          cat > settings.gradle << 'SETTINGS'
          rootProject.name = "VoiceTranslator"
          include ':app'
          SETTINGS
          cat > build.gradle << 'ROOTGRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:7.4.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
            }
          }
          ROOTGRADLE
          cat > app/build.gradle << 'APPGRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.voicetranslator'
            compileSdkVersion 33
            defaultConfig {
              applicationId "com.voicetranslator"
              minSdkVersion 26
              targetSdkVersion 33
              versionCode 22
              versionName "22.0"
            }
            signingConfigs {
              release {
                storeFile file("keystore.jks")
                storePassword "voicetranslator123"
                keyAlias "voicetranslator"
                keyPassword "voicetranslator123"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          repositories {
            google()
            mavenCentral()
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          APPGRADLE
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <application android:label="VoiceTranslator" android:icon="@mipmap/ic_launcher" android:theme="@style/Theme.AppCompat">
              <activity
                android:name=".ShareActivity"
                android:exported="true"
                android:theme="@android:style/Theme.NoDisplay">
                <intent-filter>
                  <action android:name="android.intent.action.SEND"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <data android:mimeType="text/plain"/>
                </intent-filter>
              </activity>
              <service
                android:name=".TranslatorService"
                android:exported="false"
                android:foregroundServiceType="mediaPlayback"/>
            </application>
          </manifest>
          MANIFEST
          cat > app/src/main/res/values/strings.xml << 'STRINGS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">VoiceTranslator</string>
          </resources>
          STRINGS
          echo '' | base64 -d > app/src/main/res/mipmap-ldpi/ic_launcher.png
          echo '' | base64 -d > app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo '' | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo '' | base64 -d > app/src/main/res/mipmap-xhdpi/ic_launcher.png
          echo '' | base64 -d > app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          echo '' | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cat > app/src/main/java/com/voicetranslator/ShareActivity.kt << 'SHARE'
          package com.voicetranslator
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          class ShareActivity : Activity() {
            override fun onCreate(s: Bundle?) {
              super.onCreate(s)
              val raw = intent?.getStringExtra(Intent.EXTRA_TEXT) ?: ""
              val text = cleanInput(raw)
              if (text.isNotEmpty()) {
                val serviceIntent = Intent(this, TranslatorService::class.java)
                serviceIntent.putExtra("text", text)
                startService(serviceIntent)
              }
              finish()
            }
            private fun cleanInput(text: String): String {
              return text
                .replace(Regex("https?://\\S+"), "")
                .replace(Regex("[a-zA-Z0-9.-]+\\.(com|org|net|io|ru|lv)\\S*"), "")
                .replace(Regex("%[0-9A-Fa-f]{2}"), "")
                .replace(Regex("Перейти к[^.!?\\n]*"), "")
                .replace(Regex("[Ии]дентификатор[^.!?\\n]*"), "")
                .replace(Regex("[Тт]естер[^.!?\\n]*"), "")
                .replace(Regex("закрыть", RegexOption.IGNORE_CASE), "")
                .replace(Regex("илья\\s+\\S+", RegexOption.IGNORE_CASE), "")
                .replace(Regex("основному содержанию[^.!?\\n]*"), "")
                .replace(Regex("Skip to[^.!?\\n]*", RegexOption.IGNORE_CASE), "")
                .replace(Regex("Jump to[^.!?\\n]*", RegexOption.IGNORE_CASE), "")
                .replace(Regex("Navigation[^.!?\\n]*", RegexOption.IGNORE_CASE), "")
                .replace(Regex("меню[^.!?\\n]{0,30}"), "")
                .replace(Regex("\\s{2,}"), " ")
                .trim()
            }
          }
          SHARE
          cat > app/src/main/java/com/voicetranslator/TranslatorService.kt << 'SERVICE'
          package com.voicetranslator
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.IBinder
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import androidx.core.app.NotificationCompat
          import okhttp3.*
          import org.json.JSONObject
          import java.io.IOException
          import java.util.*
          class TranslatorService : Service(), TextToSpeech.OnInitListener {
            private lateinit var tts: TextToSpeech
            private var textToTranslate = ""
            companion object {
              const val ACTION_STOP = "com.voicetranslator.STOP"
              const val CHANNEL_ID = "translator_channel"
              const val NOTIF_ID = 1
            }
            override fun onBind(intent: Intent?): IBinder? = null
            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
              if (intent?.action == ACTION_STOP) {
                if (::tts.isInitialized) tts.stop()
                stopSelf()
                return START_NOT_STICKY
              }
              textToTranslate = intent?.getStringExtra("text") ?: ""
              createNotificationChannel()
              val notification = buildNotification()
              startForeground(NOTIF_ID, notification)
              tts = TextToSpeech(this, this)
              return START_NOT_STICKY
            }
            private fun createNotificationChannel() {
              val channel = NotificationChannel(
                CHANNEL_ID, "Переводчик", NotificationManager.IMPORTANCE_LOW
              )
              getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
            }
            private fun buildNotification() = run {
              val stopIntent = PendingIntent.getService(
                this, 0,
                Intent(this, TranslatorService::class.java).apply { action = ACTION_STOP },
                PendingIntent.FLAG_IMMUTABLE
              )
              NotificationCompat.Builder(this, CHANNEL_ID)
                .setContentTitle("VoiceTranslator")
                .setContentText("Идёт перевод...")
                .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                .addAction(android.R.drawable.ic_media_pause, "Стоп", stopIntent)
                .setOngoing(true)
                .build()
            }
            // --- Определение языка ---
            private fun isCyrillic(text: String): Boolean =
              text.any { it in '\u0400'..'\u04FF' }
            private fun isChinese(text: String): Boolean =
              text.any { it in '\u4E00'..'\u9FFF' || it in '\u3400'..'\u4DBF' }
            private fun isJapanese(text: String): Boolean =
              text.any { it in '\u3040'..'\u309F' || it in '\u30A0'..'\u30FF' }
            private fun isLatvian(text: String): Boolean {
              val latvianChars = setOf('ā','č','ē','ģ','ī','ķ','ļ','ņ','š','ū','ž',
                                      'Ā','Č','Ē','Ģ','Ī','Ķ','Ļ','Ņ','Š','Ū','Ž')
              return text.any { it in latvianChars }
            }
            private fun isGerman(text: String): Boolean {
              val germanChars = setOf('ä','ö','ü','ß','Ä','Ö','Ü')
              val germanWords = listOf("der","die","das","und","ist","ich","nicht","mit","sie","auf")
              val lower = text.lowercase()
              return text.any { it in germanChars } ||
                     germanWords.count { lower.contains("\\b$it\\b".toRegex()) } >= 2
            }
            private fun isFrench(text: String): Boolean {
              val frenchWords = listOf("le","la","les","un","une","des","est","pas","avec","dans","pour","sur")
              val lower = text.lowercase()
              return frenchWords.count { lower.contains("\\b$it\\b".toRegex()) } >= 2
            }
            private fun isSpanish(text: String): Boolean {
              val spanishChars = setOf('ñ','Ñ','¿','¡')
              val spanishWords = listOf("el","la","los","las","una","que","con","del","por","como","para")
              val lower = text.lowercase()
              return text.any { it in spanishChars } ||
                     spanishWords.count { lower.contains("\\b$it\\b".toRegex()) } >= 2
            }
            // Определяем язык источника и возвращаем пару "src|tgt" и локаль TTS для результата
            private fun detectLangPair(text: String): Pair<String, Locale> {
              return when {
                isChinese(text)   -> Pair("zh|ru", Locale("ru"))
                isJapanese(text)  -> Pair("ja|ru", Locale("ru"))
                isCyrillic(text)  -> Pair("ru|en", Locale.ENGLISH)
                isLatvian(text)   -> Pair("lv|ru", Locale("ru"))
                isGerman(text)    -> Pair("de|ru", Locale("ru"))
                isFrench(text)    -> Pair("fr|ru", Locale("ru"))
                isSpanish(text)   -> Pair("es|ru", Locale("ru"))
                else              -> Pair("en|ru", Locale("ru"))
              }
            }
            override fun onInit(status: Int) {
              if (status == TextToSpeech.SUCCESS && textToTranslate.isNotEmpty()) {
                val (langpair, ttsLocale) = detectLangPair(textToTranslate)
                tts.language = ttsLocale
                translate(textToTranslate, langpair, ttsLocale)
              } else {
                stopSelf()
              }
            }
            // --- Очистка ---
            private fun cleanTranslation(raw: String): String {
              var result = raw
              result = result.replace(Regex("\\s*\\d+[,.]?\\d*\\s*(million|billion|thousand|млн|тысяч|миллион).*$", RegexOption.IGNORE_CASE), "")
              result = result.replace(Regex("\\s*\\d+%.*$", RegexOption.IGNORE_CASE), "")
              result = result.replace(Regex("^[\\d\\s,\\.]+$"), "")
              result = result.substringBefore("[")
              result = result.substringBefore("MYMEMORY")
              result = result.substringBefore("PLEASE")
              result = result.substringBefore("YOU USED")
              result = result.substringBefore("QUERY LENGTH")
              result = result.substringBefore("THIS IS A DEMO")
              result = result.replace(Regex("\\b\\d{5,}\\b"), "")
              return result.trim()
            }
            private fun isLimitError(raw: String): Boolean {
              val upper = raw.uppercase()
              return upper.contains("MYMEMORY") || upper.contains("QUERY LENGTH") ||
                     upper.contains("YOU USED") || upper.contains("DAILY LIMIT") ||
                     upper.contains("THIS IS A DEMO")
            }
            // --- Разбивка на чанки ---
            private fun splitIntoChunks(text: String, chunkSize: Int = 1500): List<String> {
              val chunks = mutableListOf<String>()
              var start = 0
              while (start < text.length) {
                var end = minOf(start + chunkSize, text.length)
                if (end < text.length) {
                  val lastSpace = text.lastIndexOf(' ', end)
                  val lastDot = text.lastIndexOf('.', end)
                  val lastComma = text.lastIndexOf(',', end)
                  val splitAt = maxOf(lastSpace, lastDot, lastComma)
                  if (splitAt > start) end = splitAt + 1
                }
                chunks.add(text.substring(start, end).trim())
                start = end
              }
              return chunks.filter { it.isNotEmpty() }
            }
            // --- TTS ---
            private fun speakAll(text: String, locale: Locale) {
              tts.language = locale
              tts.setSpeechRate(0.9f)
              tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                override fun onStart(u: String?) {}
                override fun onDone(u: String?) { if (u == "last_chunk") { tts.stop(); stopSelf() } }
                override fun onError(u: String?) { tts.stop(); stopSelf() }
              })
              // Разбиваем по знакам препинания и переносам строк
              // Сохраняем знак препинания чтобы добавить паузу
              val parts = mutableListOf<Pair<String, String>>() // текст + знак после него
              val regex = Regex("([^.!?,;:\\n]+)([.!?,;:])?")
              regex.findAll(text).forEach { match ->
                val chunk = match.groupValues[1].trim()
                val punct = match.groupValues[2]
                if (chunk.isNotEmpty()) parts.add(Pair(chunk, punct))
              }
              // Разбиваем длинные части на короткие (макс 100 символов)
              val chunks = mutableListOf<Pair<String, String>>()
              for ((chunk, punct) in parts) {
                if (chunk.length <= 100) {
                  chunks.add(Pair(chunk, punct))
                } else {
                  val words = chunk.split(" ")
                  var current = ""
                  for ((wi, word) in words.withIndex()) {
                    current += if (current.isEmpty()) word else " $word"
                    if (current.length > 80 || wi == words.size - 1) {
                      val isLast = wi == words.size - 1
                      chunks.add(Pair(current, if (isLast) punct else ""))
                      current = ""
                    }
                  }
                }
              }
              if (chunks.isEmpty()) { stopSelf(); return }
              var isFirst = true
              for ((i, pair) in chunks.withIndex()) {
                val (chunk, punct) = pair
                val isLast = i == chunks.size - 1
                val uttId = if (isLast && punct !in listOf(".", "!", "?", ",", ";", ":")) "last_chunk" else "chunk_$i"
                if (isFirst) {
                  tts.speak(chunk, TextToSpeech.QUEUE_FLUSH, null, uttId)
                  isFirst = false
                } else {
                  tts.speak(chunk, TextToSpeech.QUEUE_ADD, null, uttId)
                }
                // Паузы после знаков препинания
                when (punct) {
                  ".", "!", "?" -> tts.playSilentUtterance(35, TextToSpeech.QUEUE_ADD, null)
                  ",", ";", ":" -> tts.playSilentUtterance(25, TextToSpeech.QUEUE_ADD, null)
                }
              }
              // Финальный utterance если последний заканчивался знаком
              val lastPunct = chunks.last().second
              if (lastPunct in listOf(".", "!", "?", ",", ";", ":")) {
                tts.speak("", TextToSpeech.QUEUE_ADD, null, "last_chunk")
              }
            }
            private fun speakError(msg: String) {
              tts.language = Locale("ru")
              tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                override fun onStart(u: String?) {}
                override fun onDone(u: String?) { tts.stop(); stopSelf() }
                override fun onError(u: String?) { tts.stop(); stopSelf() }
              })
              tts.speak(msg, TextToSpeech.QUEUE_FLUSH, null, "error_msg")
            }
            // --- Перевод: MyMemory -> LibreTranslate -> Lingva ---
            private fun translate(text: String, langpair: String, ttsLocale: Locale) {
              val chunks = splitIntoChunks(text)
              translateWithMyMemory(chunks, langpair, ttsLocale, mutableListOf(), 0)
            }
            // 1. MyMemory
            private fun translateWithMyMemory(
              chunks: List<String>, langpair: String, ttsLocale: Locale,
              results: MutableList<String>, index: Int
            ) {
              if (index >= chunks.size) {
                val translated = results.filter { it.isNotEmpty() }
                if (translated.isEmpty()) { stopSelf(); return }
                speakAll(translated.joinToString(" "), ttsLocale)
                return
              }
              val encoded = java.net.URLEncoder.encode(chunks[index], "UTF-8")
              val url = "https://api.mymemory.translated.net/get?q=$encoded&langpair=$langpair&de=mastirkin2015@gmail.com"
              OkHttpClient().newCall(Request.Builder().url(url).build()).enqueue(object : Callback {
                override fun onFailure(call: Call, e: IOException) {
                  // MyMemory недоступен — переключаемся на LibreTranslate
                  val (src, tgt) = langpair.split("|")
                  translateWithLibre(chunks, src, tgt, ttsLocale, results, index)
                }
                override fun onResponse(call: Call, response: Response) {
                  val body = response.body?.string() ?: run {
                    val (src, tgt) = langpair.split("|")
                    translateWithLibre(chunks, src, tgt, ttsLocale, results, index)
                    return
                  }
                  val rawText = try {
                    JSONObject(body).getJSONObject("responseData").getString("translatedText")
                  } catch (e: Exception) {
                    val (src, tgt) = langpair.split("|")
                    translateWithLibre(chunks, src, tgt, ttsLocale, results, index)
                    return
                  }
                  if (isLimitError(rawText)) {
                    // Лимит MyMemory исчерпан — переключаемся
                    val (src, tgt) = langpair.split("|")
                    translateWithLibre(chunks, src, tgt, ttsLocale, results, index)
                    return
                  }
                  val cleaned = cleanTranslation(rawText)
                  if (cleaned.isNotEmpty()) results.add(cleaned)
                  translateWithMyMemory(chunks, langpair, ttsLocale, results, index + 1)
                }
              })
            }
            // 2. LibreTranslate (публичный сервер)
            private fun translateWithLibre(
              chunks: List<String>, src: String, tgt: String, ttsLocale: Locale,
              results: MutableList<String>, index: Int
            ) {
              if (index >= chunks.size) {
                val translated = results.filter { it.isNotEmpty() }
                if (translated.isEmpty()) { stopSelf(); return }
                speakAll(translated.joinToString(" "), ttsLocale)
                return
              }
              val libreSource = if (src == "zh") "zh" else src
              val body = okhttp3.FormBody.Builder()
                .add("q", chunks[index])
                .add("source", libreSource)
                .add("target", tgt)
                .add("format", "text")
                .build()
              val request = Request.Builder()
                .url("https://libretranslate.com/translate")
                .post(body)
                .build()
              OkHttpClient().newCall(request).enqueue(object : Callback {
                override fun onFailure(call: Call, e: IOException) {
                  translateWithLingva(chunks, src, tgt, ttsLocale, results, index)
                }
                override fun onResponse(call: Call, response: Response) {
                  val bodyStr = response.body?.string() ?: run {
                    translateWithLingva(chunks, src, tgt, ttsLocale, results, index)
                    return
                  }
                  val translated = try {
                    JSONObject(bodyStr).getString("translatedText")
                  } catch (e: Exception) {
                    translateWithLingva(chunks, src, tgt, ttsLocale, results, index)
                    return
                  }
                  if (translated.isNotEmpty()) results.add(translated.trim())
                  translateWithLibre(chunks, src, tgt, ttsLocale, results, index + 1)
                }
              })
            }
            // 3. Lingva Translate (fallback финальный)
            private fun translateWithLingva(
              chunks: List<String>, src: String, tgt: String, ttsLocale: Locale,
              results: MutableList<String>, index: Int
            ) {
              if (index >= chunks.size) {
                val translated = results.filter { it.isNotEmpty() }
                if (translated.isEmpty()) {
                  speakError("Перевод недоступен. Все сервисы не отвечают.")
                  return
                }
                speakAll(translated.joinToString(" "), ttsLocale)
                return
              }
              val encoded = java.net.URLEncoder.encode(chunks[index], "UTF-8")
              val url = "https://lingva.ml/api/v1/$src/$tgt/$encoded"
              OkHttpClient().newCall(Request.Builder().url(url).build()).enqueue(object : Callback {
                override fun onFailure(call: Call, e: IOException) {
                  speakError("Перевод недоступен. Все сервисы не отвечают.")
                }
                override fun onResponse(call: Call, response: Response) {
                  val bodyStr = response.body?.string() ?: run {
                    speakError("Перевод недоступен. Все сервисы не отвечают.")
                    return
                  }
                  val translated = try {
                    JSONObject(bodyStr).getString("translation")
                  } catch (e: Exception) {
                    speakError("Перевод недоступен. Все сервисы не отвечают.")
                    return
                  }
                  if (translated.isNotEmpty()) results.add(translated.trim())
                  translateWithLingva(chunks, src, tgt, ttsLocale, results, index + 1)
                }
              })
            }
            override fun onDestroy() {
              if (::tts.isInitialized) tts.shutdown()
              super.onDestroy()
            }
          }
          SERVICE
          curl -L https://services.gradle.org/distributions/gradle-7.6-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-7.6/bin/gradle wrapper
          chmod +x gradlew
      - name: Restore Keystore
        run: echo "" | base64 -d > app/keystore.jks
      - name: Build APK
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslator-v22
          path: app/build/outputs/apk/release/app-release.apk
